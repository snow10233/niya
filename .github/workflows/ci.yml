name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install (lockfile must be up to date)
        run: uv sync --locked
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests
