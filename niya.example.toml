# VPS 上放在 /etc/niya/niya.toml；本機可用 --config 或 NIYA_CONFIG 指定。
# 密鑰（OPENROUTER_API_KEY、CLAUDE_CODE_OAUTH_TOKEN 等）不要寫在這裡，放在環境變數或 /etc/niya/niya.env。

[agent]
provider = "claude"         # claude：Claude 訂閱（官方 Claude Code）；openrouter：OpenRouter
model = "opus"              # claude：opus / sonnet / haiku / fable 或完整 ID；openrouter：例如 anthropic/claude-sonnet-4.6
effort = ""                 # 思考強度：low / medium / high / xhigh / max（openrouter 另有 none、minimal），空白用模型預設
timezone = "Asia/Taipei"
max_iterations = 40         # 一回合最多幾次工具呼叫
max_context_tokens = 200000 # 和模型上限取較小值，是控制成本的旋鈕

[paths]
home = "/var/lib/niya"
persona = "/etc/niya/persona.md"

[web]
# 搜尋服務依序選用：TAVILY_API_KEY（搜尋＋擷取）→ BRAVE_SEARCH_API_KEY → searxng_url。
# 沒有 Tavily 時，web_extract 直接抓網頁（會擋內部與私有網路）。
searxng_url = ""
allow_private_urls = false   # 允許抓私有網段（雲端 metadata 位址永遠擋）

[egress]
# 讀過外部內容後，把本機資料傳到「陌生主機」的指令會先暫停，等主人回「好」。
# 這裡列的主機（含子網域）永遠算已知。
allow_hosts = ["github.com"]
taint_scope = "session"     # session：讀過外部內容後到睡覺前都算；turn：只算那一回合

[memory]
# 記憶的 embedding（走 OpenRouter，需要 OPENROUTER_API_KEY；沒有的話只用全文搜尋）。
# 換模型後舊記憶的向量要重算，回想門檻也是照這個模型校準的。
embedding_model = "perplexity/pplx-embed-v1-4b"
embedding_dimensions = 1024

[sleep]
# 睡覺整理記憶用的模型，格式和 niya model 一樣（例如 claude:sonnet、openrouter:anthropic/claude-haiku-5.5）。
# 空白就用目前對話的模型。
model = ""
