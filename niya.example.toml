# VPS 上放在 /etc/niya/niya.toml；本機可用 --config 或 NIYA_CONFIG 指定。
# 密鑰（OPENROUTER_API_KEY、CLAUDE_CODE_OAUTH_TOKEN 等）不要寫在這裡，放在環境變數或 /etc/niya/niya.env。

[agent]
provider = "claude"         # claude：Claude 訂閱（官方 Claude Code）；openrouter：OpenRouter
model = "opus"              # claude：opus / sonnet / haiku / fable 或完整 ID；openrouter：例如 anthropic/claude-sonnet-4.6
effort = ""                 # 思考強度：low / medium / high / xhigh / max（openrouter 另有 none、minimal），空白用模型預設
timezone = "Asia/Taipei"
max_iterations = 40         # 一回合最多幾次工具呼叫
max_context_tokens = 200000 # 和模型上限取較小值，是控制成本的旋鈕
tool_progress = true        # 呼叫工具時顯示摘要：💻 terminal，下面的 code block 放指令

[discord]
# 只回應這個 Discord 帳號（在 Discord 開啟開發者模式，對自己的頭像按右鍵「複製使用者 ID」）。
owner_id = 0
# 除了私訊之外，也在這些頻道回應主人（空的就只回私訊）。
channel_ids = []
# 設定的話，slash 指令只註冊在這個伺服器，馬上就能用；不設定則是全域指令，可能要等一陣子才出現。
guild_id = 0
# bot token 放在環境變數 DISCORD_TOKEN（/etc/niya/niya.env），不要寫在這裡。

[paths]
home = "/var/lib/niya"
persona = "/etc/niya/persona.md"

[web]
# 搜尋服務依序選用：TAVILY_API_KEY（搜尋＋擷取）→ BRAVE_SEARCH_API_KEY → searxng_url。
# 沒有 Tavily 時，web_extract 直接抓網頁（會擋內部與私有網路）。
searxng_url = ""
allow_private_urls = false   # 允許抓私有網段（雲端 metadata 位址永遠擋）

[browser]
# browser_exec 用 Browser Use CLI 操作瀏覽器。裝了 browser-use（uv tool install browser-use）就自動啟用；
# 也可以自己指定指令，例如 "uvx browser-use"。
# command = ""

[image]
# image_generate 用哪個服務畫圖。不設定就用 OpenRouter（有 OPENROUTER_API_KEY 時）。
# provider = "codex" 走 ChatGPT 方案：透過官方 Codex CLI 的 $imagegen，VPS 上要先 codex login。
# provider = "openrouter"
# model = "openai/gpt-5.4-image-2"   # 只有 openrouter 用得到
# codex_command = "codex"

[tts]
# text_to_speech 用 MiniMax（設定了 MINIMAX_API_KEY 才會啟用）。
model = "speech-2.8-hd"
voice_id = "female-shaonv"   # 系統音色或自己複製的音色 ID
region = "global"            # global：api.minimax.io；cn：api.minimaxi.com（兩邊的 key 不通用）

[egress]
# 讀過外部內容後，把本機資料傳到「陌生主機」的指令會先暫停，等主人回「好」。
# 這裡列的主機（含子網域）永遠算已知。
allow_hosts = ["github.com"]
taint_scope = "session"     # session：讀過外部內容後到睡覺前都算；turn：只算那一回合

[memory]
# 記憶的 embedding（走 OpenRouter，需要 OPENROUTER_API_KEY；沒有的話只用全文搜尋）。
# 換模型後舊記憶的向量要重算，回想門檻也是照這個模型校準的。
embedding_model = "perplexity/pplx-embed-v1-4b"
embedding_dimensions = 1024

[sleep]
# 睡覺整理記憶用的模型，格式和 niya model 一樣（例如 claude:sonnet、openrouter:anthropic/claude-haiku-5.5）。
# 也可以用 DeepSeek 官方 API：deepseek:deepseek-flash（金鑰放 DEEPSEEK_API_KEY，只能用在睡眠整理）。
# 空白就用目前對話的模型。
model = ""
# 睡覺整理時的思考強度，格式和 [agent] effort 一樣；空白用模型預設。
effort = ""
# 每次睡眠花在摘要和 REM 的上限（美元，依 API 價格估算；用 Claude 訂閱時是等值估算）。
# 對話整理（NREM）一定會做完，不受這個限制。
budget_usd = 1.0

# MCP servers：啟動時連線，工具名稱是 mcp__<名稱>__<工具>。回傳的內容一律當作外部內容
# （包上 <untrusted>、標記污染、遮蔽密鑰）。env 可以用 ${VAR} 引用環境變數，這些變數會被當成密鑰處理。
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }
#
# [mcp.servers.docs]
# url = "https://example.com/mcp"
